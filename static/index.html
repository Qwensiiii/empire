
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Empire</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #1a1a2e; color: white; font-family: Arial; text-align: center; padding: 20px; }
        .click-btn { width: 200px; height: 200px; border-radius: 50%; background: #ffd700; font-size: 40px; border: none; cursor: pointer; }
        .balance { font-size: 28px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="balance">💰 <span id="balance">0</span></div>
    <button class="click-btn" id="clickBtn">👆 ТАП</button>
    <script>
        // Инициализация Mini App
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Функция обновления баланса на экране
        function updateBalance(data) {
            if (data.balance !== undefined) {
                document.getElementById('balance').textContent = data.balance.toFixed(2);
            }
        }

        // Кнопка "ТАП" отправляет клик боту
        document.getElementById('clickBtn').onclick = function() {
            tg.sendData(JSON.stringify({ action: 'click' }));
        };

        // Запрос текущего баланса при загрузке
        tg.sendData(JSON.stringify({ action: 'get_data' }));

        // Обработка ответов от бота
        tg.onEvent('message', function(msg) {
            try {
                const data = JSON.parse(msg);
                if (data.balance !== undefined) {
                    updateBalance(data);
                }
            } catch(e) {
                console.log('Получено сообщение:', msg);
            }
        });

        // Автообновление баланса каждые 5 секунд
        setInterval(() => {
            tg.sendData(JSON.stringify({ action: 'get_data' }));
        }, 5000);

        console.log('🎮 Mini App загружен!');
    </script>
</body>
</html>
